# Include inside the existing HTTPS server for napibox on the public nginx.
# Before enabling, review inherited real_ip settings: never trust client-supplied
# forwarding headers from arbitrary peers. LAN exceptions must use the real client.
location / {
    satisfy any;
    # Populate with confirmed "allow CIDR;" entries; an empty file is fail-closed.
    include /etc/nginx/napibox/trusted-clients.conf;
    deny all;

    auth_basic "napibox";
    auth_basic_user_file /etc/nginx/napibox/htpasswd;

    client_max_body_size 350m;
    client_body_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    # Loopback endpoint of the dedicated reverse SSH tunnel.
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Replace untrusted inbound forwarding headers instead of appending to them.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep the shared Basic credential on the TLS edge only.
    proxy_set_header Authorization "";
}
