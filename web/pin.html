<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>napibox — сообщение по PIN-коду</title>
<style>:root{font:17px system-ui,sans-serif;color:#20342c;background:#f3f5ef}body{margin:0;padding:24px}main{max-width:440px;margin:12vh auto;background:white;border-radius:20px;padding:32px}h1{font-size:28px;line-height:1.2}p{line-height:1.5;color:#607267}label{display:block;margin-bottom:12px}input{box-sizing:border-box;width:100%;font:28px monospace;letter-spacing:12px;padding:14px;border:1px solid #afc2b1;border-radius:10px}button{margin-top:20px;width:100%;font:inherit;padding:14px;border:0;border-radius:10px;background:#285d3c;color:white;cursor:pointer}.error{color:#b42318}a{color:#285d3c}</style>
<main><a href="/">napibox.</a><h1>Сообщение доступно по PIN-коду</h1><p>Введите 4 цифры, чтобы расшифровать и прочитать сообщение.</p>{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}<form method="post" autocomplete="off"><label for="pin">PIN-код</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required autofocus autocomplete="off"><button type="submit">Открыть сообщение</button></form></main></html>
